<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="swooshCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="swooshSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cbd5e1"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Outer swoosh (silver) -->
  <path d="M30 4 C45 4, 52 15, 52 28 C52 12, 38 2, 25 6 C14 10, 6 20, 8 35"
        stroke="url(#swooshSilver)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Inner swoosh (cyan) -->
  <path d="M10 46 C-2 35, 2 14, 20 8 C35 3, 48 10, 48 25 C48 40, 35 48, 22 45 C10 42, 4 30, 12 18"
        stroke="url(#swooshCyan)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- D2 Text -->
  <text x="12" y="34" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="url(#textGrad)">D2</text>
</svg>
